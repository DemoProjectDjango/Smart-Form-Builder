<template>
    <template lwc:if={open}>
        <section
            role="dialog"
            tabindex="-1"
            aria-modal="true"
            aria-labelledby="setup-title"
            aria-describedby="setup-tagline"
            class="slds-modal slds-fade-in-open slds-modal_large"
            data-id="dialog"
            onkeydown={handleKeydown}>
            <div class="slds-modal__container setup-container">

                <!-- Header -->
                <header class="setup-header">
                    <div class="setup-header__text">
                        <p class="setup-eyebrow">One-time setup</p>
                        <h2 id="setup-title" class="setup-title">Enable public form submissions</h2>
                        <p id="setup-tagline" class="setup-tagline">
                            5 steps in Salesforce Setup, about 10 minutes. You only do this once per org.
                        </p>
                    </div>
                    <lightning-button-icon
                        icon-name="utility:close"
                        variant="bare-inverse"
                        size="large"
                        alternative-text="Close setup guide"
                        title="Close"
                        class="setup-close"
                        onclick={handleClose}>
                    </lightning-button-icon>
                    <div class="setup-progress" aria-hidden="true">
                        <div class="setup-progress__bar" style={progressStyle}></div>
                    </div>
                </header>

                <!-- Body -->
                <div class="slds-modal__content setup-body">
                    <div class="setup-layout">

                        <!-- Step rail -->
                        <nav class="setup-rail" aria-label="Setup steps">
                            <ol class="rail-list">
                                <template for:each={steps} for:item="step">
                                    <li key={step.id} class="rail-item">
                                        <button
                                            type="button"
                                            class={step.railClass}
                                            data-index={step.index}
                                            aria-current={step.ariaCurrent}
                                            onclick={handleRailClick}>
                                            <span class="rail-step__marker">
                                                <template lwc:if={step.isDone}>
                                                    <lightning-icon icon-name="utility:check" size="xx-small" variant="inverse" alternative-text="Visited"></lightning-icon>
                                                </template>
                                                <template lwc:else>{step.number}</template>
                                            </span>
                                            <span class="rail-step__label">{step.short}</span>
                                        </button>
                                    </li>
                                </template>
                            </ol>
                        </nav>

                        <!-- Current step -->
                        <div class="setup-step" aria-live="polite">
                            <template lwc:if={currentStep}>
                                <p class="step-counter">{stepCounter}</p>
                                <div class="step-heading">
                                    <span class="step-heading__icon">
                                        <lightning-icon icon-name={currentStep.icon} size="small" alternative-text=""></lightning-icon>
                                    </span>
                                    <h3 class="step-title">{currentStep.title}</h3>
                                </div>

                                <div class="step-where">
                                    <lightning-icon icon-name="utility:setup" size="xx-small" alternative-text="Where"></lightning-icon>
                                    <span>{currentStep.whereLabel}</span>
                                </div>

                                <p class="step-why">{currentStep.why}</p>

                                <ol class="step-actions">
                                    <template for:each={currentStep.items} for:item="item">
                                        <li key={item.key} class="step-action">
                                            <template for:each={item.segments} for:item="seg">
                                                <template lwc:if={seg.isUi}>
                                                    <strong key={seg.key} class="seg-ui">{seg.value}</strong>
                                                </template>
                                                <template lwc:elseif={seg.isValue}>
                                                    <span key={seg.key} class="seg-value">
                                                        <code class="seg-value__text">{seg.value}</code>
                                                        <template lwc:if={seg.copyable}>
                                                            <button
                                                                type="button"
                                                                class="seg-value__copy"
                                                                data-value={seg.value}
                                                                title="Copy"
                                                                onclick={handleCopy}>
                                                                <lightning-icon icon-name="utility:copy" size="xx-small" alternative-text="Copy"></lightning-icon>
                                                            </button>
                                                        </template>
                                                    </span>
                                                </template>
                                                <template lwc:else>
                                                    <span key={seg.key}>{seg.value}</span>
                                                </template>
                                            </template>
                                        </li>
                                    </template>
                                </ol>

                                <template lwc:if={currentStep.hasExample}>
                                    <div class="step-example">
                                        <span class="step-example__label">Example</span>
                                        <code class="step-example__value">{currentStep.example}</code>
                                    </div>
                                </template>

                                <template lwc:if={currentStep.hasCallout}>
                                    <div class={currentStep.calloutClass} role="note">
                                        <lightning-icon icon-name={currentStep.calloutIcon} size="x-small" alternative-text=""></lightning-icon>
                                        <p>{currentStep.calloutText}</p>
                                    </div>
                                </template>

                                <template lwc:if={isLast}>
                                    <div class="step-finish">
                                        <lightning-icon icon-name="utility:success" size="small" alternative-text=""></lightning-icon>
                                        <div>
                                            <p class="step-finish__title">That's everything</p>
                                            <p>
                                                Close this guide and click <strong>Recheck</strong>. Then open any form's link
                                                in a private browser window and send a test submission.
                                            </p>
                                        </div>
                                    </div>
                                </template>
                            </template>
                        </div>
                    </div>
                </div>

                <!-- Footer -->
                <footer class="setup-footer">
                    <span class="setup-footer__counter">{stepCounter}</span>
                    <div class="setup-footer__actions">
                        <lightning-button
                            label="Back"
                            icon-name="utility:chevronleft"
                            onclick={handleBack}
                            disabled={isFirst}>
                        </lightning-button>
                        <template lwc:if={isLast}>
                            <lightning-button
                                variant="brand"
                                label="Done"
                                onclick={handleClose}
                                class="slds-m-left_x-small">
                            </lightning-button>
                        </template>
                        <template lwc:else>
                            <lightning-button
                                variant="brand"
                                label="Next"
                                icon-name="utility:chevronright"
                                icon-position="right"
                                onclick={handleNext}
                                class="slds-m-left_x-small">
                            </lightning-button>
                        </template>
                    </div>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </template>
</template>
