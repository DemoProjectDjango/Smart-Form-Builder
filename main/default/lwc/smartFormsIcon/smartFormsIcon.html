<template>
    <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width={strokeWidth}
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        focusable="false">
        <template for:each={paths} for:item="p">
            <path key={p.key} d={p.d}></path>
        </template>
    </svg>
</template>
